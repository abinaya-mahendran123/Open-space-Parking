# Low-RAM PC (~7GB). Close Chrome / Android Studio / extra IDEs before building.
# One JVM heap only: Kotlin compiles in-process (no second Kotlin daemon).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.vfs.watch=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Avoid a separate Kotlin daemon (that was OOMing at 384m).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=false
# Skip lint during assemble — avoids downloading lint-*.jar when DNS/network is flaky.
android.lint.enable=false
android.builder.sdkDownload=false
# Point AGP/Flutter plugins (:jni) at the installed side-by-side NDK.
android.ndkVersion=28.2.13676358
