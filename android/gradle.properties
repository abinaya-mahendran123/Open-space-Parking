# Keep heaps small — this PC often has <1GB free RAM during Flutter builds.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.vfs.watch=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
kotlin.daemon.jvmargs=-Xmx384m -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=false
# Skip lint during assemble — avoids downloading lint-*.jar when DNS/network is flaky.
android.lint.enable=false
android.builder.sdkDownload=false
# Point AGP/Flutter plugins (:jni) at the installed side-by-side NDK.
android.ndkVersion=28.2.13676358
