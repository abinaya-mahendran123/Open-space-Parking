# Low-RAM PC (~7GB). Close Chrome / Android Studio / extra IDEs before building.
# Metaspace must be high enough for Kotlin 2.x FIR; one JVM heap for in-process Kotlin.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.configureondemand=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Avoid a separate Kotlin daemon when possible.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=false
android.lint.enable=false
android.builder.sdkDownload=false
android.ndkVersion=28.2.13676358
