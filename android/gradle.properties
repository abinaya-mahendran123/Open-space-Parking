# Modest heap for ~8GB RAM. Jetifier OFF — it OOM'd transforming Flutter engine jars.
# preferIPv4Stack: intermittent "No such host" on dl.google.com / maven from Gradle/Java.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
org.gradle.vfs.watch=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
kotlin.daemon.jvmargs=-Xmx768m -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=false
# Skip lint during assemble — avoids downloading lint-*.jar when DNS/network is flaky.
android.lint.enable=false
android.builder.sdkDownload=false
